<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuaca</title>
<style>
  :root{
    --sky:#1b2a4a; --sky-deep:#0d1730; --cloud:#e8edf7;
    --sun:#f4b942; --line:#2b3c63; --dim:#8593b8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100%;
    background: linear-gradient(180deg, var(--sky) 0%, var(--sky-deep) 100%);
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    color:var(--cloud);
    display:flex; justify-content:center;
    padding: 28px 14px;
    padding-top: calc(28px + env(safe-area-inset-top,0px));
    padding-bottom: calc(28px + env(safe-area-inset-bottom,0px));
  }
  .wrap{ width:100%; max-width:420px; }

  select{
    width:100%; background:#16233f; color:var(--cloud);
    border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; font-size:15px; margin-bottom:18px; outline:none;
  }

  .hero{
    background: linear-gradient(155deg,#213768 0%,#152548 100%);
    border:1px solid var(--line); border-radius:20px;
    padding:28px 24px; text-align:center; position:relative; overflow:hidden;
  }
  .hero::after{
    content:""; position:absolute; right:-30px; top:-30px;
    width:130px;height:130px;border-radius:50%;
    background:radial-gradient(circle,#f4b94222 0%,transparent 70%);
  }
  .city{ font-size:15px; color:var(--dim); margin:0 0 2px 0; }
  .temp{ font-size:56px; font-weight:600; margin:6px 0; font-variant-numeric:tabular-nums; }
  .cond{ font-size:15px; color:var(--dim); margin:0; }
  .icon{ margin: 8px auto 4px auto; width:64px; height:64px; }

  .stats{
    display:grid; grid-template-columns:1fr 1fr 1fr;
    gap:10px; margin:18px 0;
  }
  .stat{
    background:#16233f; border:1px solid var(--line); border-radius:12px;
    padding:12px 8px; text-align:center;
  }
  .stat .v{ font-size:16px; font-weight:600; }
  .stat .l{ font-size:11px; color:var(--dim); margin-top:2px; }

  .fc-title{ font-size:13px; color:var(--dim); margin:20px 0 10px 4px; }
  .fc-list{ display:flex; flex-direction:column; gap:8px; }
  .fc-row{
    display:flex; align-items:center; justify-content:space-between;
    background:#16233f; border:1px solid var(--line); border-radius:12px;
    padding:10px 16px;
  }
  .fc-day{ font-size:14px; width:80px; }
  .fc-mini{ width:26px; height:26px; }
  .fc-range{ font-size:14px; font-variant-numeric:tabular-nums; color:var(--dim); }
  .fc-range b{ color:var(--cloud); }
</style>
</head>
<body>
<div class="wrap">

  <select id="citySelect">
    <option value="Jakarta">Jakarta</option>
    <option value="Bandung">Bandung</option>
    <option value="Surabaya">Surabaya</option>
    <option value="Yogyakarta">Yogyakarta</option>
    <option value="Denpasar">Denpasar</option>
  </select>

  <div class="hero">
    <p class="city" id="cityName">Jakarta</p>
    <div class="icon" id="mainIcon"></div>
    <p class="temp" id="mainTemp">--&deg;</p>
    <p class="cond" id="mainCond">--</p>
  </div>

  <div class="stats">
    <div class="stat"><div class="v" id="humidity">--%</div><div class="l">Kelembapan</div></div>
    <div class="stat"><div class="v" id="wind">-- km/j</div><div class="l">Angin</div></div>
    <div class="stat"><div class="v" id="uv">--</div><div class="l">Indeks UV</div></div>
  </div>

  <p class="fc-title">5 Hari ke Depan</p>
  <div class="fc-list" id="fcList"></div>

</div>

<script>
  const data = {
    Jakarta:   { cond:'Cerah Berawan',  temp:31, hum:68, wind:14, uv:7, seed:1 },
    Bandung:   { cond:'Berawan',        temp:23, hum:74, wind:9,  uv:4, seed:2 },
    Surabaya:  { cond:'Panas Terik',    temp:34, hum:55, wind:11, uv:9, seed:3 },
    Yogyakarta:{ cond:'Hujan Ringan',   temp:26, hum:82, wind:13, uv:3, seed:4 },
    Denpasar:  { cond:'Cerah',          temp:30, hum:64, wind:16, uv:8, seed:5 },
  };
  const days = ['Sel','Rab','Kam','Jum','Sab'];

  function icon(kind, size){
    const s = size;
    if (kind === 'sun') return `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><circle cx="32" cy="32" r="14" fill="#f4b942"/></svg>`;
    if (kind === 'cloud') return `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><ellipse cx="32" cy="38" rx="20" ry="12" fill="#c7d2ea"/><circle cx="24" cy="30" r="11" fill="#e8edf7"/><circle cx="38" cy="28" r="13" fill="#e8edf7"/></svg>`;
    if (kind === 'rain') return `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><ellipse cx="32" cy="26" rx="18" ry="11" fill="#9fb0d6"/><line x1="22" y1="42" x2="18" y2="54" stroke="#6f8cd6" stroke-width="3" stroke-linecap="round"/><line x1="32" y1="42" x2="28" y2="54" stroke="#6f8cd6" stroke-width="3" stroke-linecap="round"/><line x1="42" y1="42" x2="38" y2="54" stroke="#6f8cd6" stroke-width="3" stroke-linecap="round"/></svg>`;
    return `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><circle cx="24" cy="34" r="10" fill="#f4b942"/><ellipse cx="38" cy="36" rx="16" ry="10" fill="#c7d2ea"/></svg>`;
  }
  function kindFor(cond){
    if (cond.includes('Hujan')) return 'rain';
    if (cond.includes('Cerah Berawan')) return 'partly';
    if (cond.includes('Cerah') || cond.includes('Panas')) return 'sun';
    return 'cloud';
  }

  function seededRange(seed, dayIdx, base){
    const n = Math.sin(seed * 99 + dayIdx * 17) * 10000;
    const frac = n - Math.floor(n);
    return Math.round(base - 4 + frac * 6);
  }

  function render(city){
    const d = data[city];
    document.getElementById('cityName').textContent = city;
    document.getElementById('mainTemp').textContent = d.temp + '\u00b0';
    document.getElementById('mainCond').textContent = d.cond;
    document.getElementById('mainIcon').innerHTML = icon(kindFor(d.cond), 64);
    document.getElementById('humidity').textContent = d.hum + '%';
    document.getElementById('wind').textContent = d.wind + ' km/j';
    document.getElementById('uv').textContent = d.uv;

    const kinds = ['sun','cloud','rain','partly','sun'];
    document.getElementById('fcList').innerHTML = days.map((day, i) => {
      const lo = seededRange(d.seed, i, d.temp) - 6;
      const hi = seededRange(d.seed, i, d.temp);
      return `<div class="fc-row">
        <span class="fc-day">${day}</span>
        <span class="fc-mini">${icon(kinds[i], 26)}</span>
        <span class="fc-range">${lo}&deg; <b>${hi}&deg;</b></span>
      </div>`;
    }).join('');
  }

  document.getElementById('citySelect').addEventListener('change', e => render(e.target.value));
  render('Jakarta');
</script>
</body>
</html>
